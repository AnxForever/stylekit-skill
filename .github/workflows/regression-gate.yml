name: StyleKit Skill Regression Gate

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate SKILL.md frontmatter
        run: |
          head -1 SKILL.md | grep -q '^---$' || { echo "SKILL.md must start with YAML frontmatter"; exit 1; }
          grep -q '^name: stylekit$' SKILL.md || { echo "SKILL.md missing 'name: stylekit'"; exit 1; }
          grep -q '^description:' SKILL.md || { echo "SKILL.md missing description"; exit 1; }

      - name: Reject unpublished-package wording
        run: |
          if grep -Eiq 'not (yet )?published|unpublished|repository[- ]only|尚未发布' SKILL.md; then
            echo "SKILL.md must not claim packages are unpublished (they are public beta on npm)";
            exit 1;
          fi

      - name: Verify referenced endpoints return 200
        run: |
          for url in \
            https://www.stylekit.top/api/styles \
            https://www.stylekit.top/r/glassmorphism.json \
            https://www.stylekit.top/llms-full.txt \
            https://www.stylekit.top/api/styles/neo-brutalist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url")
            echo "$code $url"
            [ "$code" = "200" ] || { echo "FAIL: $url returned $code"; exit 1; }
          done

      - name: Test scripts/fetch-style.py
        run: |
          python3 scripts/fetch-style.py glassmorphism --tokens | grep -q "TOKENS" || { echo "fetch-style.py failed"; exit 1; }
          python3 scripts/fetch-style.py neo-brutalist --recipes | grep -q "STYLE:" || { echo "fetch-style.py --recipes failed"; exit 1; }
          python3 scripts/fetch-style.py --search cyberpunk | grep -q "vaporwave" || { echo "fetch-style.py --search failed"; exit 1; }

      - name: Test scripts/detect-project.py
        run: |
          mkdir -p /tmp/ds-test && cd /tmp/ds-test
          echo '{"dependencies": {"next": "15.1.0", "tailwindcss": "4.0.0"}}' > package.json
          echo '{"aliases": {"components": "components"}}' > components.json
          mkdir -p components/button
          cd -
          python3 scripts/detect-project.py /tmp/ds-test | grep -q '"framework": "next"' || { echo "detect-project.py framework detection failed"; exit 1; }
          python3 scripts/detect-project.py /tmp/ds-test | grep -q '"version": 4' || { echo "detect-project.py tailwind detection failed"; exit 1; }
          python3 scripts/detect-project.py /tmp/ds-test | grep -q '"detected": true' || { echo "detect-project.py shadcn detection failed"; exit 1; }
          mkdir -p /tmp/empty-proj && python3 scripts/detect-project.py /tmp/empty-proj | grep -q '"framework": null' || { echo "detect-project.py empty-dir failed"; exit 1; }

      - name: Test scripts/verify-spec.py
        run: |
          python3 scripts/verify-spec.py neo-brutalist | grep -q "Verified 1 style" || { echo "verify-spec.py single-style failed"; exit 1; }
          python3 scripts/verify-spec.py neo-brutalist --json | grep -q '"checked": 1' || { echo "verify-spec.py json mode failed"; exit 1; }

      - name: Test scripts/eval-check.py
        run: |
          cat > /tmp/compliant.tsx << 'EOF'
          export function Button() {
            return <button className="px-6 py-3 bg-[#ff006e] text-white font-black border-4 border-black rounded-none">OK</button>;
          }
          EOF
          cat > /tmp/violating.tsx << 'EOF'
          export function Button() {
            return <button className="px-6 py-3 bg-blue-500 rounded-lg shadow-lg">Bad</button>;
          }
          EOF
          python3 scripts/eval-check.py neo-brutalist /tmp/compliant.tsx || { echo "eval-check.py rejected compliant code"; exit 1; }
          if python3 scripts/eval-check.py neo-brutalist /tmp/violating.tsx; then
            echo "eval-check.py accepted violating code"; exit 1;
          fi

      - name: Run with/without-skill benchmark
        run: |
          python3 scripts/benchmark.py | tee /tmp/benchmark.txt
          grep -q "with-skill pass rate:    4/4" /tmp/benchmark.txt || { echo "benchmark regressed: with-skill must score 4/4"; exit 1; }
          grep -q "without-skill pass rate: 0/4" /tmp/benchmark.txt || { echo "benchmark baseline must score 0/4 (fixture drift)"; exit 1; }
